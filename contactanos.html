<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Rolling Game Zone es una página centrada en componentes y perifericos de computadoras" />
    <meta name="author" content="Ramiro Calderon - Mario Facundo Ruiz - Lisandro Rivas Guerrero - Diego Giménez" />
    <meta name="keywords"
        content="perifericos - mouse - teclados - placa de videos - monitores - gabinetes - ventiladores - pad" />
    <title>Rolling Game Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://kit.fontawesome.com/8920af91e1.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>

    <header>

    </header>
    <main>
        <!-- CONTACTANOS CARDS FORMULARIO -->
        <div class="container py-4 py-lg-5">
            <div class="row g-4 g-lg-5">

                <!-- CONTACTANOS  -->
                <section class="col-12 col-lg-5 order-1 order-lg-1">
                    <div class="card card-contacto border shadow-sm h-100">
                        <div class="card-body p-3 p-md-4">

                            <h1 class="mb-3">Contactanos<i class="fa-solid fa-user"></i></h1>

                            <p class="text-secondary mb-4">
                                ¿Tenés alguna consulta sobre nuestros productos?
                                Estamos para ayudarte.
                            </p>

                            <div class="mb-4">
                                <h2 class="h6">Email</h2>
                                <p class="mb-0">rollingamezone@gmail.com</p>
                            </div>

                            <div class="mb-4">
                                <h2 class="h6">Teléfono</h2>
                                <p class="mb-0">+54 9 0000 000000</p>
                            </div>

                            <div class="mb-2">
                                <h2 class="h6">Horarios de atención</h2>
                                <p class="mb-0">
                                    Lunes a viernes, de 9 a 18 hs.

                                </p>
                            </div>
                            <!-- Redes sociales -->
                            <div class="mt-4">
                                <h2 class="h6 mb-3">Seguinos en nuestras redes</h2>

                                <div class="redes-sociales">
                                    <a href="error404.html" aria-label="Instagram">
                                        <i class="fa-brands fa-square-instagram"></i>
                                    </a>

                                    <a href="error404.html" aria-label="Facebook">
                                        <i class="fa-brands fa-square-facebook"></i>
                                    </a>

                                    <a href="error404.html" aria-label="Reddit">
                                        <i class="fa-brands fa-reddit"></i>
                                    </a>
                                </div>
                            </div>

                        </div>
                    </div>
                </section>

                <!-- Formulario -->
                <section class="col-12 col-lg-7 order-2 order-lg-2">
                    <div class="card card-formulario border shadow-sm h-100">
                        <div class="card-body p-3 p-md-4 p-lg-5">

                            <h2 class="h4 mb-4">Envianos tu consulta <i class="fa-solid fa-comment"></i></h2>

                            <form>
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">
                                        Nombre completo
                                    </label>
                                    <input type="text" class="form-control" id="nombre" name="nombre"
                                        placeholder="Tu nombre" autocomplete="name" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        Correo electrónico
                                    </label>
                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="nombre@mail.com" autocomplete="email" required>
                                </div>

                                <div class="mb-3">
                                    <label for="motivo" class="form-label">
                                        Motivo de consulta
                                    </label>
                                    <select class="form-select" id="motivo" name="motivo" required>
                                        <option value="" selected disabled>
                                            Seleccioná una opción
                                        </option>
                                        <option value="producto">
                                            Consulta sobre un producto
                                        </option>
                                        <option value="pedido">
                                            Estado de mi pedido
                                        </option>
                                        <option value="garantia">
                                            Garantía o devolución
                                        </option>
                                        <option value="armado">
                                            Armado de PC o asesoramiento técnico
                                        </option>
                                        <option value="otro">
                                            Otro motivo
                                        </option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label for="mensaje" class="form-label">
                                        Mensaje
                                    </label>
                                    <textarea class="form-control" id="mensaje" name="mensaje" rows="4"
                                        placeholder="Dejanos tu consulta..." required></textarea>
                                </div>

                                <button type="submit" class="btn-enviar w-100">
                                    Enviar!
                                </button>
                            </form>

                        </div>
                    </div>
                </section>

                <!-- Ubicación -->
                <section class="col-12 order-3">
                    <div class="card card-ubicacion border shadow-sm">
                        <div class="card-body p-3 p-md-4">

                            <h2 class="h4 mb-3">Cómo llegar <i class="fa-solid fa-location-pin"></i></h2>

                            <div class="ratio ratio-4x3">
                                <iframe
                                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3560.1059174753195!2d-65.2097472897975!3d-26.836583276595455!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94225d3ad7f30f1d%3A0xf8606cd659b8e3e4!2sRollingCode%20School!5e0!3m2!1ses!2sar!4v1791904109203!5m2!1ses!2sar"
                                    title="Ubicación de RollingCode School" allowfullscreen loading="lazy"
                                    referrerpolicy="strict-origin-when-cross-origin">
                                </iframe>
                            </div>

                        </div>
                    </div>
                </section>

            </div>
        </div>
    </main>
    
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
