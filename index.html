<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rolling Game Zone es una página centrada en componentes y perifericos de computadoras"
    />
    <meta
      name="author"
      content="Ramiro Calderon - Mario Facundo Ruiz - Lisandro Rivas Guerrero - Diego Giménez"
    />
    <meta
      name="keywords"
      content="perifericos - mouse - teclados - placa de videos - monitores - gabinetes - ventiladores - pad"
    />
    <title>Rolling Game Zone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://kit.fontawesome.com/7a7b342afd.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbarRolling">
        <div class="container-fluid">
          <img
            src="./assets/rollinGameZoneLogo.png"
            alt="Logo de Rolling Game Zone"
            class="logoRolling"
          />
          <button
            class="navbar-toggler bg-light"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <form role="search" class="buscadorRolling">
              <input
                type="search"
                class="form-control"
                placeholder="¿Que estas buscando?"
              />
            </form>
            <ul class="navbar-nav">
              <li class="nav-item">
                <a href="#" class="nav-link">CATEGORIAS</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">PC ARMADAS</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">PERIFERICOS</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">INICIO</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">LOGIN</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link botonPc">ARMA TU PC</a>
              </li>
            </ul>
            <div class="iconosContainer d-flex align-items-center">
              <a href="#">
                <i class="fa-solid fa-cart-shopping iconosRolling"></i>
              </a>
              <a href="#">
                <i class="fa-regular fa-user iconosRolling"></i>
              </a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="menuContenedor">
        <div class="menuItems">
          <a href="">
            <img src="./assets/logoWsp.png" alt="" class="menuLogos" />
          </a>
          <a href="">
            <img src="./assets/logoCarrito.png" alt="" class="menuLogos" />
          </a>
          <a href=""
            ><img src="./assets/logoHome.png" alt="" class="menuLogos" />
          </a>
          <a href="#buscadorNavbar" aria-label="Ir al buscador">
            <img src="./assets/logoLupa.png" alt="" class="menuLogos" />
          </a>
        </div>
      </div>
    </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
