<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rolling Game Zone es una página centrada en componentes y perifericos de computadoras"
    />
    <meta
      name="author"
      content="Ramiro Calderon - Mario Facundo Ruiz - Lisandro Rivas Guerrero - Diego Giménez"
    />
    <meta
      name="keywords"
      content="perifericos - mouse - teclados - placa de videos - monitores - gabinetes - ventiladores - pad"
    />
    <title>Rolling Game Zone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />

    <script
      src="https://kit.fontawesome.com/7a7b342afd.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbarRolling">
        <div class="container-fluid">
          <img
            src="./assets/rollinGameZoneLogo.png"
            alt="Logo de Rolling Game Zone"
            class="logoRolling"
          />
          <form role="search" class="buscadorRolling">
            <input
              type="search"
              class="form-control"
              placeholder="¿Qué estás buscando?"
            />
          </form>

          <button
            class="btn-icon navbar-toggler"
            type="button"
            data-bs-toggle="drawer"
            data-bs-target="#navbarNavMenu"
            aria-controls="navbarNavMenu"
            aria-expanded="false"
            aria-label="Abrir menú de navegación"
          >
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
          </button>

          <dialog
            class="drawer drawer-end"
            id="navbarNavMenu"
            aria-labelledby="navbarNavMenuLabel"
          >
            <div class="drawer-header">
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="drawer"
                aria-label="Cerrar"
              ></button>
            </div>

            <div class="drawer-body">
              <ul class="navbar-nav align-items-center">
                <li class="nav-item">
                  <a class="nav-link" href="#">CATEGORÍAS</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">PC ARMADAS</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">PERIFÉRICOS</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">INICIO</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">LOGIN</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link botonPc" href="#">ARMA TU PC</a>
                </li>
              </ul>

              <div class="iconosContainer">
                <a href="#" aria-label="Carrito de compras">
                  <i class="fa-solid fa-cart-shopping iconosRolling"></i>
                </a>
                <a href="#" aria-label="Mi cuenta">
                  <i class="fa-regular fa-user iconosRolling"></i>
                </a>
              </div>
            </div>
          </dialog>
        </div>
      </nav>
    </header>
    <main>
      <div
        id="carouselExampleDark"
        class="carousel carousel-overlay slide"
        data-bs-theme="dark"
      >
        <div class="carousel-inner">
          <div class="carousel-item active" data-bs-interval="10000">
            <img
              src="assets/imgCarousel4.png"
              class="d-block w-100"
              alt="Pc de Rolling Game Zone con sus componentes"
            />
          </div>
          <div class="carousel-item" data-bs-interval="2000">
            <img
              src="assets/imgCarousel2.png"
              class="d-block w-100"
              alt="Pc de Rolling Game Zone con sus componentes"
            />
          </div>
          <div class="carousel-item">
            <img
              src="assets/imgCarousel3.png"
              class="d-block w-100"
              alt="Pc de Rolling Game Zone con sus componentes"
            />
          </div>
        </div>
        <div class="carousel-overlay-controls">
          <button
            class="btn-icon btn-sm btn-subtle"
            type="button"
            data-bs-target="#carouselExampleDark"
            data-bs-slide="prev"
          >
            <span class="carousel-icon-prev" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <div class="carousel-indicators">
            <button
              type="button"
              data-bs-target="#carouselExampleDark"
              data-bs-slide-to="0"
              aria-current="true"
              aria-label="Slide 1"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleDark"
              data-bs-slide-to="1"
              aria-label="Slide 2"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleDark"
              data-bs-slide-to="2"
              aria-label="Slide 3"
            ></button>
          </div>
          <button
            class="btn-icon btn-sm btn-subtle theme-secondary"
            type="button"
            data-bs-target="#carouselExampleDark"
            data-bs-slide="next"
          >
            <span class="carousel-icon-next" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
      <div class="marquesinaContenedor">
        <div class="marquesina">
          <img src="./assets/msi.png" alt="" />
          <img src="./assets/nvidiaLogo.png" alt="" />
          <img src="./assets/amdLogo.png" alt="" />
          <img src="./assets/acerLogo.jpg" alt="" />
          <img src="./assets/asusLogo.png" alt="" />
          <img src="./assets/hpLogo.png" alt="" />
          <img src="./assets/sonyLogo.png" alt="" />
          <img src="./assets/logitechLogo.png" alt="" />

          <img src="./assets/msi.png" alt="" />
          <img src="./assets/nvidiaLogo.png" alt="" />
          <img src="./assets/amdLogo.png" alt="" />
          <img src="./assets/acerLogo.jpg" alt="" />
          <img src="./assets/asusLogo.png" alt="" />
          <img src="./assets/hpLogo.png" alt="" />
          <img src="./assets/sonyLogo.png" alt="" />
          <img src="./assets/logitechLogo.png" alt="" />
        </div>
      </div>
      <div class="menuContenedor">
        <div class="menuItems">
          <a href="">
            <img src="./assets/logoWsp.png" alt="" class="menuLogos" />
          </a>
          <a href="">
            <img src="./assets/logoCarrito.png" alt="" class="menuLogos" />
          </a>
          <a href=""
            ><img src="./assets/logoHome.png" alt="" class="menuLogos" />
          </a>
          <a href="#buscadorNavbar" aria-label="Ir al buscador">
            <img src="./assets/logoLupa.png" alt="" class="menuLogos" />
          </a>
        </div>
      </div>
    </main>
    <footer>
      <div class="box">
            <figure>
                <img src="/assets/rollinGameZoneLogo.png" alt="">
            </figure>
      </div>

      <div class="footer-section">

        <h3>Rolling Game Zone</h3>
      <ul>
        <li>
            <a href="#">Inicio</a>
        </li>
        <li>
            <a href="#">Contacto</a>
        </li>
        <li>
            <a href="#">Sobre nosotros</a>
        </li>

      <div class="footer-section">
        <h3>Redes sociales</h3>
      <ul class="social-icons">
        <li>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
        </li>
        <li>
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
        </li>
        <li>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </li>
        <li>
            <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
        </li>
      </ul>
      <p class="copy-message">Copyright <small>Rolling Game Zone</small> - 2026. Todos los derechos reservados. Defensa de las y los consumidores. </p>
      </div>

    </footer>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
