<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Rolling Game Zone</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <main class="paginaFormulario">
      <div class="contenedordest">
        <!-- Formulario -->
        <section class="container">
          <div class="form-box">
            <h1>Rolling Game Zone</h1>
            <h2>Información personal</h2>

            <form>
              <div class="campo">
                <label for="nombre">Nombre</label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  autocomplete="given-name"
                  required
                />
              </div>

              <div class="campo">
                <label for="apellido">Apellido</label>
                <input
                  type="text"
                  id="apellido"
                  name="apellido"
                  autocomplete="family-name"
                  required
                />
              </div>

              <div class="campo">
                <label for="usuario">Correo electrónico</label>
                <input
                  type="email"
                  id="usuario"
                  name="usuario"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="campo">
                <label for="telefono">Teléfono</label>
                <input
                  type="tel"
                  id="telefono"
                  name="telefono"
                  autocomplete="tel"
                  required
                />
              </div>

              <div class="campo">
                <label for="domicilio">Domicilio</label>
                <input
                  type="text"
                  id="domicilio"
                  name="domicilio"
                  autocomplete="street-address"
                  required
                />
              </div>

              <div class="campo">
                <label for="codigo">Código postal</label>
                <input
                  type="text"
                  id="codigo"
                  name="codigo"
                  autocomplete="postal-code"
                  required
                />
              </div>

              <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input
                  type="password"
                  id="contrasena"
                  name="contrasena"
                  autocomplete="new-password"
                  required
                />
              </div>

              <button type="submit" class="btn-ingresar">Registrarse</button>
            </form>

            <!-- Inicio de sesión con redes sociales -->
            <div class="social-login">
              <p>O ingresá con</p>

              <button type="button" class="btn-google" onclick="loginGoogle()">
                <img
                  src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                  alt=""
                />
                Continuar con Google
              </button>

              <button
                type="button"
                class="btn-facebook"
                onclick="loginFacebook()"
              >
                <span class="facebook-icon">f</span>
                Continuar con Facebook
              </button>
            </div>
          </div>
        </section>

        <!-- Imagen del gabinete -->
        <aside class="imagen-section">
          <div class="imagen-box">
            <img
              src="./assets/gabinete-6x6.jpeg"
              alt="Gabinete de computadora para gaming"
            />
            <div class="imagen-glow"></div>
          </div>
        </aside>
      </div>
    </main>
  </body>
</html>
